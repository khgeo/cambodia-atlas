<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Kantumruy+Pro:wght@400;600&family=Moul&display=swap">
<link rel="stylesheet" href="shared/vendor/maplibre-gl.css">
<link rel="stylesheet" href="shared/atlas.css">
</head>
<body>
<div class="plate-app">
  <header class="bar" id="bar"></header>
  <div class="explorer-body">
    <aside class="panel"><div class="panel-inner" id="panel"></div></aside>
    <div class="mapwrap"><div class="map" id="map"></div></div>
  </div>
</div>
<script src="shared/vendor/maplibre-gl.js"></script>
<script src="shared/vendor/pmtiles.js"></script>
<script src="shared/atlas.js"></script>
<script>
(async () => {
  const A = window.Atlas, km = A.lang === "km";
  A.renderBar(document.getElementById("bar"));
  const panel = document.getElementById("panel");
  panel.innerHTML = `<div><div class="eyebrow">${A.t("explorer")}</div><h1>${km ? "ស្រទាប់ទាំងអស់" : "All layers"}</h1></div>
    <p class="muted" style="margin:0">${km ? "បើក ឬបិទស្រទាប់ពីផែនទីនីមួយៗ ដើម្បីប្រៀបធៀបនៅលើផែនទីតែមួយ។" : "Turn layers from each plate on and off to compare them on one map."}</p>
    <div class="layer-group" id="layers"><p class="muted">${A.t("loading")}</p></div>`;
  const map = await A.createMap(document.getElementById("map"), { center: [104.92, 11.56], zoom: 11, contextUrl: "shared/data/context-phnompenh.geojson" });
  const cat = await A.catalog();
  const live = cat.chapters.flatMap((c) => c.plates).filter((p) => p.status === "live");
  const box = document.getElementById("layers"); box.innerHTML = "";
  for (const p of live) {
    try {
      const { meta, mod, base } = await A.loadPage(p.id);
      const ids = await mod.addLayers(map, { base, meta, lang: A.lang, explorer: true });
      const initial = ids.map((id) => (map.getLayer(id) && map.getLayoutProperty(id, "visibility")) || "visible");
      const row = document.createElement("label"); row.className = "layer-row";
      row.innerHTML = `<input type="checkbox" id="lyr-${p.id}" checked> <span>${A.t("plate")} ${A.esc(p.no)} · ${A.esc(A.pick(p, "title"))}</span>`;
      row.querySelector("input").onchange = (e) => ids.forEach((id, i) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", e.target.checked ? initial[i] : "none"));
      box.appendChild(row);
    } catch (e) { console.error(e); }
  }
})();
</script>
</body>
</html>
